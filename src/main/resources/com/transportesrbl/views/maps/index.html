<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        #map { height: 100vh; width: 100%; margin: 0; }
    </style>
</head>
<body>
    <div id="map"></div>
    <script>
        var map = L.map('map').setView([3.4516, -76.5320], 13); // Centrado en Cali

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        function calcularRuta(lat1, lon1, lat2, lon2) {
            var url = `https://router.project-osrm.org/route/v1/driving/${lon1},${lat1};${lon2},${lat2}?overview=full&geometries=geojson`;

            fetch(url)
                .then(res => res.json())
                .then(data => {
                    var route = data.routes[0];
                    var distance = (route.distance / 1000).toFixed(2); // km
                    var duration = Math.round(route.duration / 60);    // min

                    // Dibujar la línea en el mapa
                    L.geoJSON(route.geometry).addTo(map);
                    
                    // Enviar datos a Java (opcional)
                    console.log("Distancia: " + distance + " km, Tiempo: " + duration + " min");
                    
                    // Ajustar vista
                    var bounds = L.geoJSON(route.geometry).getBounds();
                    map.fitBounds(bounds);
                });
        }
    </script>
</body>
</html>
